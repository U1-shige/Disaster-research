[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebooklm-cli"
version = "0.1.0"
description = "災害復旧事業調査向け NotebookLM CLI ツール"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "notebooklm-py[browser]>=0.8.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[project.scripts]
nlm-research = "notebooklm_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
